# Buffett agent configuration.
#
# Every threshold the engine uses lives here. Secrets do not: those come from
# environment variables (see README).
#
# Defaults are deliberately strict. Loosening `gates` or `valuation` will
# surface more names every night, most of which you should not buy.

[schedule]
timezone = "Asia/Jakarta"
hour = 21
minute = 0

[portfolio]
# The equity you are actually willing to deploy into this strategy, in USD.
# Override at runtime with the PORTFOLIO_EQUITY_USD environment variable.
equity_usd = 100000.0
# Share held back so you can always buy more when prices fall further.
cash_reserve = 0.20
# Set this from a rate you looked up if you want rupiah figures in the report.
# Left unset, the report stays in USD rather than inventing a rate.
# usd_to_idr = 16250.0

[universe]
source = "sp500"          # sp500 | inline | file:PATH
max_tickers = 520
min_market_cap_usd = 2_000_000_000.0
# Sectors you would rather not underwrite at all. Buffett's circle of
# competence is a personal boundary, so this starts empty.
exclude_sectors = []
exclude_tickers = []
# Used when source = "inline".
tickers = []

[gates]
# Pass/fail filters. A name failing any of these is never recommended at any
# price, because the job is avoiding permanent loss rather than finding the
# biggest discount.
min_years_history = 5
min_positive_earnings_years = 5
min_positive_fcf_years = 4
min_avg_roe = 0.12
min_avg_roic = 0.09
max_debt_to_equity = 1.5
min_interest_coverage = 5.0
min_piotroski_f = 5
min_altman_z = 1.81
max_beneish_m = -1.78
max_share_growth = 0.02
min_data_completeness = 0.70

[valuation]
risk_free_rate = 0.042
equity_risk_premium = 0.050
discount_rate_floor = 0.08
discount_rate_cap = 0.16
terminal_growth = 0.025
stage1_years = 10
growth_cap = 0.10
growth_floor = -0.02
growth_haircut = 0.75
max_normalized_pe = 15.0
# Blend weights across the four methods. Must sum to 1.0.
weight_dcf = 0.40
weight_epv = 0.30
weight_multiple = 0.20
weight_graham = 0.10
# The discount you demand before a name is actionable at all.
min_margin_of_safety = 0.25
fallback_tax_rate = 0.21

[kelly]
# Half Kelly. The inputs are estimates, not known odds, and overbetting on
# estimated parameters costs far more than underbetting.
fraction = 0.50
max_position = 0.20
min_position = 0.02
max_sector_exposure = 0.35
p_floor = 0.35
p_ceiling = 0.80
min_downside = 0.10
max_downside = 0.60

[rank]
weight_margin_of_safety = 40.0
weight_quality = 30.0
weight_confidence = 15.0
weight_dividend = 15.0
mos_saturation = 0.60
dividend_saturation = 0.045

[tranches]
# Fractions of the target position deployed per tranche, and the extra margin of
# safety each later tranche waits for.
splits = [0.50, 0.30, 0.20]
mos_steps = [0.00, 0.10, 0.20]
# If the price never falls to the next trigger, deploy anyway after this many days.
time_spacing_days = 30

[agent]
model = "claude-opus-5"
max_tokens = 12000
memo_candidates = 5
enabled = true

[report]
top_n = 5
watchlist_n = 12
output_dir = "reports"
write_html = true
write_markdown = true
write_json = true
language = "id"           # id | en

[data]
# SEC requires a real contact string. Set SEC_USER_AGENT in the environment.
sec_user_agent = "buffett-agent (set contact via SEC_USER_AGENT env)"
cache_dir = ".cache"
cache_ttl_hours = 20.0
price_history_days = 1900
max_workers = 6
request_timeout = 30.0
max_retries = 4
