name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
      # The offline path exercises the whole pipeline with no network, so a
      # broken report renderer fails CI rather than the 9 PM run.
      - run: python -m buffett.run --offline --no-notify --no-agent --output-dir /tmp/ci-reports
